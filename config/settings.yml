# mitsync settings. Env vars named here are read from the process environment
# (or .env if you export it); secrets never live in this file.

canvas:
  base_url: https://canvas.mit.edu/api/v1
  token_env: CANVAS_TOKEN        # name of the env var holding the Canvas token
  per_page: 100
  term: auto                     # "auto" = only terms whose start/end cover today
  max_retries: 5
  min_rate_limit_remaining: 100.0  # back off when Canvas reports less than this

llm:
  driver: auto                   # auto | api | agent | rules
                                 # auto -> api when the api key env var is set, else agent
  provider: anthropic            # anthropic | openai | google | openai_compatible
  model: claude-opus-5
  api_key_env: ANTHROPIC_API_KEY
  base_url: null                 # required for openai_compatible
  max_output_tokens: 8000
  temperature: 0

calendar:
  cli: ical-guy                  # EventKit CLI emitting JSON; ekctl also works
  lookahead_days: 14

graph:
  backend: duckdb                # duckdb | neo4j
  neo4j:
    uri: null
    user: null
    password_env: null

organize:
  include_existing: false        # true = also file pre-existing workspace files
  link_mode: hardlink            # hardlink | copy | symlink

# Paths (workspace-relative) never scanned, mirrored, or organized.
ignore_globs:
  - "**/.DS_Store"
  - "**/.venv/**"
  - "**/site-packages/**"
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "AI_Studio/nandatown/**"
