# mitsync settings. Env vars named here are read from the process environment
# (or .env if you export it); secrets never live in this file.

canvas:
  base_url: https://canvas.mit.edu/api/v1
  token_env: CANVAS_TOKEN        # name of the env var holding the Canvas token
  per_page: 100
  term: auto                     # "auto" = only terms whose start/end cover today.
                                 # With "auto", when at least one course sits in a
                                 # properly dated current term, courses whose term
                                 # carries no dates at all (Canvas's "Default Term")
                                 # are excluded and reported in the sync report.
  exclude_courses: []            # never sync these: a Canvas course id, or a
                                 # case-insensitive substring of the course name
                                 # or course_code. Example (already handled by the
                                 # dateless-term rule above -- shown here only to
                                 # document the mechanism):
                                 #   - 17557   # F-1 Immigration Orientation eCourse
  max_retries: 5
  min_rate_limit_remaining: 100.0  # back off when Canvas reports less than this

calendar:
  # MitsyncCalendar.app via its shim (`make calendar-helper`), so the OpenClaw
  # gateway can hold its own Calendar grant; ical-guy only works from a terminal.
  cli: /Users/filippostrub/Desktop/MIT/courses/_agent/bin/mitsync-calendar
  lookahead_days: 14

graph:
  backend: duckdb                # the only implemented backend

organize:
  link_mode: hardlink            # hardlink | copy | symlink

email:                           # the morning brief; the recipient is fixed by config, never by the agent
  # sender and to come from MITSYNC_EMAIL_SENDER / MITSYNC_EMAIL_TO in _agent/.env (kept out of git)
  password_env: GMAIL_APP_PASSWORD   # a Gmail app password, kept in _agent/.env
  node: /Users/filippostrub/.nvm/versions/node/v26.10.0/bin/node   # the LaunchAgent has no nvm, so the absolute path

# Paths (workspace-relative) never scanned, mirrored, or organized.
ignore_globs:
  - "**/.DS_Store"
  - "**/.venv/**"
  - "**/site-packages/**"
  - "**/node_modules/**"
  - "**/__pycache__/**"
  # Broad on purpose: this list REPLACES DEFAULT_IGNORE_GLOBS wholesale, so it must
  # not be narrower than the default. Matches nandatown wherever it appears.
  - "**/nandatown/**"
