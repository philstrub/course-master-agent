# Canvas course -> workspace folder mapping.
#
# Maintained by hand; mitsync never writes it. It is also the list of folders
# that count as courses: extraction, the knowledge base and `organize
# --include-existing` only look inside folders named here (plus `_canvas/`),
# so other top-level directories (e.g. OpenClaw's `memory/`) are never indexed.
#
# `folder` must match the workspace folder name on disk byte-for-byte.
# `aliases` are the course-number spellings actually seen in filenames and
# calendar events; the organizer and `calendar_read.tag_course` match on them.

