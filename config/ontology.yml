# Knowledge-graph ontology — v0 PLACEHOLDER, meant to be replaced.
#
# The user will supply the real ontology. Nothing downstream hardcodes these
# names: `mitsync graph rebuild` re-derives the entire graph from the extracted
# facts in `_kb/graph/*.jsonl`, so editing this file and rebuilding is a
# complete, lossless change of schema.
#
# Edges are validated against `source`/`target`; unknown node or edge types are
# rejected with an OntologyError naming the offending record.

version: 0

node_types:
  Course:
    attributes: [name, course_number, term, canvas_id]
  Session:
    attributes: [title, number, date, kind]   # kind: lecture | recitation | lab
  Assignment:
    attributes: [title, due_at, points, kind] # kind: pset | project | exam
  Resource:
    attributes: [title, path, content_type, source_url]
  Concept:
    attributes: [name, aliases, description]
  Person:
    attributes: [name, role, email]           # role: instructor | ta | student

edge_types:
  covers:
    source: [Session, Resource]
    target: [Concept]
    attributes: [depth, evidence]
  requires:
    source: [Assignment, Session]
    target: [Concept, Resource]
    attributes: []
  assesses:
    source: [Assignment]
    target: [Concept]
    attributes: [weight]
  prerequisite_of:
    source: [Concept, Session]
    target: [Concept, Session]
    attributes: []
  authored_by:
    source: [Resource, Session, Assignment]
    target: [Person]
    attributes: []
  part_of:
    source: [Session, Assignment, Resource]
    target: [Course]
    attributes: []
