[project]
name = "mitsync"
version = "0.1.0"
description = "Keep MIT course materials mirrored, filed, and turned into a knowledge base."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml>=6",
    "duckdb>=1.0",
    "jsonschema>=4",
    "python-frontmatter>=1.1",
    "pymupdf>=1.24",
    "neo4j>=5.20",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mitsync = "mitsync.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mitsync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
